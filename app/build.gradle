plugins {
    id 'com.android.application'
}

android {
    namespace 'org.teleagent.echopress'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/debug.keystore")
            storePassword 'echopress'
            keyAlias 'echopress-debug'
            keyPassword 'echopress'
        }
    }

    defaultConfig {
        applicationId "org.teleagent.echopress"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
