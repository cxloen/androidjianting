name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (auto-accepts licenses, installs packages)
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            build-tools;33.0.2
            platforms;android-33
            ndk;25b
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      - name: Export SDK env vars for Buildozer
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}"     >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25b" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          pip install buildozer cython
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: earmonitor-debug
          path: bin/*.apk
