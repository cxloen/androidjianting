name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # 不使用 android-actions/setup-android@v4 —— 该 action 在 ubuntu-latest 上有
          # 已知 EACCES 权限 bug (issue #535)。这里用 runner 预装的 sdkmanager 手动安装。
          # ANDROID_HOME 已由 runner 预设为 /usr/local/lib/android/sdk
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}"   >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "ndk;25b"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/25b" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          pip install buildozer cython
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echopress-debug
          path: bin/*.apk
